[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-amani-python"
version = "3.0.0"
description = "Python conversion of the All-amani WhatsApp and Telegram bot"
requires-python = ">=3.9"
dependencies = [
  "python-telegram-bot>=21.0,<23",
  "httpx>=0.27,<0.29",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
ignore = ["UP037", "UP045", "ASYNC230", "N999"]
