[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jan-main-python"
version = "1.0.0"
description = "Python port of the Jan-main WhatsApp and Telegram bot"
requires-python = ">=3.10"
dependencies = [
  "neonize>=0.4.3.post0",
  "python-telegram-bot>=21.0,<23",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
